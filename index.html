<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figger</title>
<meta name="description" content="A design tool in one HTML file: frames, auto layout, components and styles. Your files stay on your disk.">
<meta property="og:title" content="Figger">
<meta property="og:description" content="A design tool in one HTML file: frames, auto layout, components and styles. Your files stay on your disk.">
<meta property="og:url" content="https://figger.naklitechie.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D99FF'/%3E%3Cpath d='M10 8h12v4H14v4h7v4h-7v4h-4z' fill='white'/%3E%3C/svg%3E">
<style>
/* Figger: Dense direction, light by default; it does not follow the system dark mode.
   A NakliOS host theme overrides these tokens through applyHostTheme(). */
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --ink: #1e1e1e;
  --muted: #6b6b6b;
  --line: #e6e6e6;
  --row: #f2f2f2;
  --accent: #0d99ff;
  --component: #9747ff;
  --danger: #d93a26;
  --canvas-bg: #f5f5f5;
  --font: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12px/1.4 var(--font); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
kbd { font: 11px var(--font); color: var(--muted); }
.booting { padding: 24px; color: var(--muted); }

#app { display: grid; grid-template-rows: 40px 1fr 24px; height: 100vh; }
.main { display: grid; grid-template-columns: 240px 1fr 260px; min-height: 0; }

/* toolbar */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
.tb-left, .tb-right, .tools { display: flex; align-items: center; gap: 2px; }
.tb-mid { flex: 1; display: flex; justify-content: center; }
.brand { font-weight: 700; margin: 0 10px 0 4px; letter-spacing: 0.2px; }
.tool, .icon, .menu-btn, .zoom { border: 0; background: none; height: 30px; min-width: 30px; border-radius: 6px; padding: 0 8px; font-size: 14px; }
.zoom, .icon { font-size: 12px; }
.tool:hover, .icon:hover, .menu-btn:hover, .zoom:hover { background: var(--row); }
.tool.on { background: var(--accent); color: #fff; }
.icon:disabled { opacity: 0.35; cursor: default; background: none; }
.doc-name { border: 1px solid transparent; background: none; text-align: center; font-weight: 600; padding: 4px 8px; border-radius: 6px; min-width: 200px; }
.doc-name:hover { border-color: var(--line); }
.doc-name:focus { border-color: var(--accent); outline: none; }

/* menu */
.menu { position: fixed; z-index: 30; background: #1e1e1e; color: #fff; border-radius: 8px; padding: 6px; min-width: 260px; max-height: 80vh; overflow: auto; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.menu-group { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #9a9a9a; padding: 8px 8px 2px; }
.menu-item { display: flex; justify-content: space-between; gap: 16px; width: 100%; border: 0; background: none; text-align: left; padding: 5px 8px; border-radius: 4px; color: #fff; }
.menu-item:hover { background: var(--accent); }
.menu-item kbd { color: #bdbdbd; }

/* canvas */
.canvas-wrap { position: relative; overflow: hidden; background: var(--canvas-bg); outline: none; }
.canvas-wrap canvas { position: absolute; inset: 0; display: block; touch-action: none; }
.text-editor { position: absolute; left: 0; top: 0; transform-origin: 0 0; border: 0; outline: 1px solid var(--accent); background: transparent; resize: none; padding: 0; margin: 0; overflow: hidden; white-space: pre; z-index: 5; }

/* side panels */
.layers, .props { background: var(--panel); overflow: auto; min-height: 0; }
.layers { border-right: 1px solid var(--line); }
.props { border-left: 1px solid var(--line); }
.panel-head { position: sticky; top: 0; background: var(--panel); font-weight: 600; padding: 10px 12px 6px; z-index: 1; }
.ly-row { display: flex; align-items: center; gap: 4px; height: 28px; padding-right: 4px; border-radius: 4px; margin: 0 4px; cursor: default; user-select: none; }
.ly-row:hover { background: var(--row); }
.ly-row.sel { background: #e5f4ff; }
.ly-row.comp .ly-icon, .ly-row.comp .ly-name { color: var(--component); }
.ly-row.hidden .ly-name { opacity: .45; }
.ly-row[data-drop=before] { box-shadow: inset 0 2px 0 var(--accent); }
.ly-row[data-drop=after] { box-shadow: inset 0 -2px 0 var(--accent); }
.ly-row[data-drop=inside] { outline: 2px solid var(--accent); outline-offset: -2px; }
.ly-twist { border: 0; background: none; width: 14px; padding: 0; color: var(--muted); font-size: 10px; }
.ly-icon { width: 16px; text-align: center; color: var(--muted); }
.ly-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ly-tools { display: flex; gap: 0; opacity: 0; }
.ly-row:hover .ly-tools, .ly-toggle.on, .ly-toggle.off:is([title=Show]) { opacity: 1; }
.ly-row:hover .ly-tools { opacity: 1; }
.ly-toggle { border: 0; background: none; width: 20px; height: 20px; padding: 0; font-size: 10px; color: var(--muted); border-radius: 4px; }
.ly-toggle:hover { background: #e6e6e6; }
.ly-rename { flex: 1; border: 1px solid var(--accent); border-radius: 3px; padding: 1px 4px; }
.ly-more, .ly-empty { padding: 10px 12px; color: var(--muted); }

/* properties */
.props-body { padding-bottom: 24px; }
.ps-head { padding: 12px 12px 4px; display: flex; flex-direction: column; gap: 2px; }
.ps-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.ps-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ps { border-top: 1px solid var(--line); padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.ps h3 { margin: 0 0 2px; font-size: 11px; font-weight: 600; }
.ps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 6px; }
.ps-row { display: flex; gap: 4px; align-items: center; }
.ps-row.pad, .ps-note.pad { padding: 4px 12px 8px; }
.ps-col { display: flex; flex-direction: column; gap: 6px; }
.ps-note { color: var(--muted); font-size: 11px; }
.ps-field { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 6px; }
.ps-field > span { color: var(--muted); }
.ps-check { display: flex; gap: 6px; align-items: center; }
.ps input[type=text], .ps input[type=number], .ps select { width: 100%; min-width: 0; height: 26px; border: 1px solid transparent; background: var(--row); border-radius: 4px; padding: 0 6px; }
.ps input[type=text]:focus, .ps input[type=number]:focus, .ps select:focus { border-color: var(--accent); outline: none; background: #fff; }
.ps input.small { width: 64px; }
.ps input[type=color] { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 4px; padding: 1px; background: #fff; flex: none; }
.ps input.hex { font-family: ui-monospace, Menlo, monospace; text-transform: uppercase; }
.ps-btn { height: 26px; border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 0 10px; white-space: nowrap; }
.ps-btn:hover { border-color: #bdbdbd; }
.ps-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.ps-aa { font-weight: 600; width: 26px; text-align: center; }
.ps-comp { flex: 1; color: var(--component); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg { display: inline-flex; background: var(--row); border-radius: 5px; padding: 2px; flex: 1; }
.seg button { flex: 1; border: 0; background: none; border-radius: 4px; height: 22px; }
.seg button.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.bad { outline: 1px solid var(--danger) !important; }

/* number field */
.nf { display: flex; align-items: center; background: var(--row); border-radius: 4px; height: 26px; border: 1px solid transparent; }
.nf:focus-within { border-color: var(--accent); background: #fff; }
.nf-label { width: 28px; flex: none; text-align: center; color: var(--muted); cursor: ew-resize; user-select: none; font-size: 11px; }
.nf input { flex: 1; min-width: 0; border: 0 !important; background: transparent !important; height: 24px; padding: 0 4px 0 0 !important; outline: none; }
.nf-unit { color: var(--muted); padding-right: 6px; }

/* status */
.status { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 11px; }

/* palette */
.palette-back { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.12); display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; }
.palette { width: min(560px, 92vw); background: #fff; border-radius: 10px; box-shadow: 0 16px 50px rgba(0,0,0,.25); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; font-size: 15px; outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
.palette li { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 6px; }
.palette li.active { background: var(--accent); color: #fff; }
.palette li.active .pl-group, .palette li.active kbd { color: #dff1ff; }
.pl-label { flex: 1; }
.pl-group { color: var(--muted); font-size: 11px; }
.palette li.empty { color: var(--muted); }

/* dialogs and toast */
.dlg { border: 0; border-radius: 10px; padding: 18px 20px; width: min(420px, 92vw); box-shadow: 0 16px 50px rgba(0,0,0,.25); color: var(--ink); }
.dlg.wide { width: min(640px, 94vw); }
.dlg::backdrop { background: rgba(0,0,0,.2); }
.dlg h2 { margin: 0 0 8px; font-size: 15px; }
.dlg p { margin: 0 0 12px; color: var(--muted); }
.dlg-input { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 5px; padding: 0 8px; margin-bottom: 12px; }
.dlg-buttons { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.dlg-buttons button { height: 30px; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 0 14px; }
.dlg-buttons .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.dlg-buttons .danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.shortcuts { max-height: 55vh; overflow: auto; margin-bottom: 10px; }
.shortcuts table { width: 100%; border-collapse: collapse; }
.shortcuts td { padding: 4px 0; border-bottom: 1px solid var(--row); }
.shortcuts td:last-child { text-align: right; }
.shortcuts kbd { margin-left: 8px; }
.toast { position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 20px); background: #1e1e1e; color: #fff; padding: 8px 14px; border-radius: 8px; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: 80vw; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { background: var(--danger); }

@media (max-width: 900px) {
  .main { grid-template-columns: 180px 1fr 220px; }
  .brand, .doc-name { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

</style>
</head>

 *

 *     }
 *
 *     // Shared host inference (when the user grants this app access):
 *     if (naklios.capabilities.ai) {
 *       const stream = await naklios.ai.chat.completions.create({
 *         messages: [{ role: 'user', content: 'Summarise this note.' }],
 *         stream: true,
 *       });
 *       for await (const chunk of stream) {
 *         render(chunk.choices[0].delta.content || '');
 *       }
 *
 *       const image = await naklios.ai.images.generate({
 *         prompt: 'A risograph poster of a city after monsoon rain',
 *         size: '1024x1024',
 *         signal: abortController.signal,
 *       });
 *       preview.src = image.data[0].b64_json
 *         ? 'data:image/png;base64,' + image.data[0].b64_json
 *         : image.data[0].url;
 *     }
 *   <\/script>
 *

 * naklios.capabilities.fs is true when hosted storage is available to the app.
 * naklios.capabilities.fsBackends lists connected Folder/Crate choices, and
 * naklios.capabilities.fsBackend is the app's current binding (or null).
 * Apps may call naklios.fs.useBackend(id); NakliOS confirms the change.
 * Listen for changes via naklios.onCapabilitiesChange(cb).
 *
 * Paths in fs methods are relative to apps/<your-app-id>/ on the selected backend.
 * Traversal (../) is blocked at the host.
 *
 * Single source of truth: https://naklios.dev/sdk/naklios.js
 *   (repo: NakliTechie/nakliOS → sdk/naklios.js)
 * Vendor it inline in each app to keep the no-network-dependency ethos.
 *
 * @naklios-sdk-version 2
 *   Vendored copies are spliced between two HTML comment markers and kept fresh
 *   by each app's own CI — never hand-edited. See docs/app-contract.md "Vendoring
 *   the SDK" and plan/sdk-vendoring.md. In the app's HTML, an "naklios-sdk:begin"

 *   v2 = approved-parent origin + ?naklios flag (no-referrer-safe). v1 (pre-2026-08)
 *   posted to '*' and skipped inbound-origin checks — a v1 copy is a drift bug.
 *
 *   New public members ship as `experimental_<name>` with a line in docs/sdk-api-audit.md

(function () {
  // A real host FRAME is what the transports talk to (postMessage to parent), so
  // it gates every send/rpc — `inNakliOS`. The `?naklios` URL flag is the host's
  // EXPLICIT signal (it appends it to embed URLs) and a deliberate opt-in for
  // testing; it sets capabilities.hosted so an app KNOWS to route through NakliOS,
  // but it never fakes a channel that isn't there — a bare `?naklios` top-level tab
  // has no host, so fs/ai capabilities stay false (no handshake) and the app's
  // adapter falls back to its own APIs. No hang, no breakage.

  try { inNakliOS = !!(window.parent && window.parent !== window); } catch (_) {}

  // be used to verify the parent (that path breaks hosted detection — it is the
  // Lorewell iframe bug). Instead the first `naklios:*` message from window.parent
  // pins an independently approved host origin, and every later send targets that origin (not '*').
  // Before verification, only content-free ready and capabilities-request messages leave.

  var queuedHostMessages = [];

  // Inline copies retain the same production host policy; previews are limited
  // to this project's Workers hostname. Referrers are deliberately unnecessary.

      if (url.protocol === 'https:' && !url.port && (url.hostname === 'naklios.dev' ||

  var themeListeners = new Set();
  var capListeners = new Set();
  var beforeCloseCb = null;

    // hosted honours the ?naklios flag as well as a real embed, so an app can
    // decide to route through NakliOS; the fs/ai flags below only flip true after
    // a real host handshake, so the adapter still self-corrects with no channel.

    flagged: naklFlag,
    version: 2,
    fs: false,
    fsBackends: [],
    fsBackend: null,
    fsBoundedReads: false,
    fsRangeReads: false,
    // system: this app is a same-origin system app (non-third-party).
    // sysFs: system-scoped filesystem is available — the whole store, not just
    // apps/<your-id>/. Only true for system apps with a connected backend.
    system: false,
    sysFs: false,
    ai: false,
    aiModel: null,
    aiModelLabel: null,
    aiProvider: null,
    aiLocal: true,
    aiState: 'idle',
    aiImages: false,
    aiImageModel: null,
    aiImageModelLabel: null,
    aiImageProvider: null,
    aiImageLocal: true,
    aiImageState: 'idle',
    aiSearchState: 'idle',
    aiSearch: false,
    // experimental_tex: this app may compile LaTeX projects in its own storage.
    experimental_tex: false,
    // experimental_web: this app may search the web and read pages through the host.

    netBackend: null,

  var fileEditListeners = new Set();
  var pendingFileEdits = [];
  var acceptedFileEdits = new Map();
  var acceptingFileEdits = new Map();

  function deliverFileEdit(proposal) {
    var id=String(proposal.deliveryId||'');

      try{return Promise.resolve(cb(proposal)).catch(function(){return false;});}catch(_){return Promise.resolve(false);}

  var appliedReviewIds = new Set();
  var applyingReviewIds = new Map();

    } catch (_) { return false; }

  var COMMAND_CALL_TIMEOUT_MS = 300000;
  var AI_LOCAL_TIMEOUT_MS = 300000;

    if (!inNakliOS) return Promise.reject(new Error('Not hosted — naklios.* unavailable standalone'));

        return;
      }

      setTimeout(function () {
