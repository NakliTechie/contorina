<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#fff}
.wrap{display:grid;grid-template-columns:480px 1fr;height:100%}
.text{padding:64px 0 0 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:84px;letter-spacing:-2px;color:#1e1e1e}
p{margin:0;font-size:32px;line-height:1.3;color:#1e1e1e}
.small{font-size:22px;color:#6b6b6b}
.shot{background:#f5f5f5;border-left:1px solid #e6e6e6;overflow:hidden;position:relative}
.shot img{position:absolute;left:-120px;top:-60px;width:1150px;border:1px solid #e6e6e6;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.dot{width:56px;height:56px;border-radius:14px;background:#0D99FF}
</style></head><body><div class="wrap"><div class="text"><div class="dot"></div><h1>Contorina</h1>
<p>A design tool in one HTML file. Frames, auto layout, components and styles.</p>
<p class="small">Your files stay on your disk. No account.</p></div>
<div class="shot"><img src="hero.png" alt=""></div></div></body></html>
