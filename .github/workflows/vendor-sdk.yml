# Keeps the inlined NakliOS SDK in src/shell.html fresh against https://naklios.dev/sdk/naklios.js,
# rebuilds index.html from it, and commits both to the default branch (the Vocella pattern; the app
# pulls, NakliOS never pushes). A splice that the --check step cannot confirm fails the run.
name: Vendor naklios SDK

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: write
  actions: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Re-splice canonical SDK into src/shell.html
        run: node scripts/vendor-naklios-sdk.mjs --file src/shell.html
      - name: Verify the splice
        run: node scripts/vendor-naklios-sdk.mjs --file src/shell.html --check
      - name: Rebuild index.html
        run: node build.mjs
      - name: Commit the refreshed SDK and build
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- src/shell.html index.html; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/shell.html index.html
          git commit -m 'chore: refresh vendored naklios SDK from canonical'
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Test the refreshed app
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref "${GITHUB_REF_NAME}"
